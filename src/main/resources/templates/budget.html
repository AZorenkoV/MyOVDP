<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Домашній Бюджет — Витрати</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .nav-links {
            margin-bottom: 20px;
        }
        .nav-links a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        /* Панель підсумків */
        .summary-card {
            background-color: #e74c3c;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: inline-block;
        }
        .summary-card h3 {
            margin: 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }
        .summary-card .amount {
            font-size: 28px;
            font-weight: bold;
            margin-top: 5px;
        }
        /* Форма */
        .form-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
            color: #7f8c8d;
        }
        .form-group input, .form-group select {
            padding: 8px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-submit {
            grid-column: 1 / -1;
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #1a252f;
        }
        /* Таблиця */
        .table-section {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
            color: #7f8c8d;
            padding: 12px 15px;
            font-size: 13px;
            text-transform: uppercase;
            border-bottom: 2px solid #eaeaea;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eaeaea;
            font-size: 15px;
        }
        tr:hover {
            background-color: #fcfcfc;
        }
        .btn-delete {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-delete:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-links">
        <a href="/" class="back-link">⬅️ На головну</a>
    </div>

    <h1>Сімейний бюджет: Витрати</h1>

    <div class="summary-card">
        <h3>Всього витрачено</h3>
        <div class="amount" th:text="${totalExpenses} + ' ₴'">0.00 ₴</div>
    </div>

    <div class="form-section">
        <h2>Додати витрату</h2>
        <form th:action="@{/budget/expense/add}" th:object="${newExpense}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="date">Дата</label>
                    <input type="date" id="date" th:field="*{date}" required>
                </div>
                <div class="form-group">
                    <label for="amount">Сума (₴)</label>
                    <input type="number" step="0.01" id="amount" th:field="*{amount}" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="category">Категорія</label>
                    <select id="category" th:field="*{category}" required>
                        <option value="Продукти">Продукти</option>
                        <option value="Комуналка / Зв'язок">Комуналка / Зв'язок</option>
                        <option value="Транспорт / Авто">Транспорт / Авто</option>
                        <option value="Здоров'я">Здоров'я</option>
                        <option value="Розваги / Кафе">Розваги / Кафе</option>
                        <option value="Одяг / Взуття">Одяг / Взуття</option>
                        <option value="Амортизація / Техніка">Амортизація / Техніка</option>
                        <option value="Інше">Інше</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="account">Рахунок списання</label>
                    <input type="text" id="account" th:field="*{account}" placeholder="Напр. Моно, Готівка" required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label for="description">Опис / Подробиці</label>
                    <input type="text" id="description" th:field="*{description}" placeholder="Напр. Сільпо, заправка ОККО">
                </div>
                <button type="submit" class="btn-submit">Зберегти транзакцію</button>
            </div>
        </form>
    </div>

    <div class="table-section">
        <table>
            <thead>
            <tr>
                <th>Дата</th>
                <th>Категорія</th>
                <th>Сума</th>
                <th>Рахунок</th>
                <th>Опис</th>
                <th>Дія</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="expense : ${expenses}">
                <td th:text="${#temporals.format(expense.date, 'dd.MM.yyyy')}">20.06.2026</td>
                <td th:text="${expense.category}">Продукти</td>
                <td style="font-weight: bold; color: #c0392b;" th:text="'-' + ${expense.amount} + ' ₴'">-100.00 ₴</td>
                <td th:text="${expense.account}">Моно</td>
                <td th:text="${expense.description}">Сільпо</td>
                <td>
                    <form th:action="@{/budget/expense/delete/{id}(id=${expense.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn-delete" onclick="return confirm('Видалити цю витрату?')">Видалити</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="6" style="text-align: center; color: #7f8c8d; padding: 20px;">Витрат поки немає. Додайте першу транзакцію вище.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
