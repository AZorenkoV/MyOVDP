<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мій Портфель ОВДП</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f4f7f6; color: #333; }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #bdc3c7; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 5px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; }
        th { background-color: #34495e; color: white; text-transform: uppercase; font-size: 14px; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .status-pending { background-color: #ffeaa7; color: #d63031; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .type-coupon { color: #2980b9; font-weight: bold; }
        .type-maturity { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

<h1>📊 Мій Інвестиційний Портфель ОВДП</h1>
<table>
    <thead>
    <tr>
        <th>ISIN</th>
        <th>Назва</th>
        <th>Брокер</th>
        <th>Ціна купівлі</th>
        <th>Кількість</th>
        <th>Купон (1 шт)</th>
        <th>Погашення</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="bond : ${bonds}">
        <td th:text="${bond.isin}" style="font-weight: bold;">ISIN</td>
        <td th:text="${bond.name}">Назва</td>
        <td th:text="${bond.broker}">Брокер</td>
        <td th:text="${bond.price} + ' грн'">0.00</td>
        <td th:text="${bond.quantity}">0</td>
        <td th:text="${bond.couponAmount} + ' грн'">0.00</td>
        <td th:text="${bond.maturityDate}">2026-01-01</td>
    </tr>
    </tbody>
</table>

<h2>📅 Загальний календар майбутніх виплат</h2>
<table>
    <thead>
    <tr>
        <th>Дата виплати</th>
        <th>Облігація</th>
        <th>Тип виплати</th>
        <th>Сума до отримання</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="payment : ${calendar}">
        <td th:text="${payment.paymentDate}" style="font-weight: bold;">2026-01-01</td>
        <td th:text="${payment.bond.name}">Назва ОВДП</td>
        <td>
            <span th:if="${payment.type == 'COUPON'}" class="type-coupon">🎫 КУПОН</span>
            <span th:if="${payment.type == 'MATURITY'}" class="type-maturity">💰 ПОГАШЕННЯ ТІЛА</span>
        </td>
        <td th:text="${payment.amount} + ' грн'" style="font-weight: bold; color: #2c3e50;">0.00</td>
        <td><span class="status-pending" th:text="${payment.status}">PENDING</span></td>
    </tr>
    </tbody>
</table>

</body>
</html>
